[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "bodyrig"
version = "0.1.0"
description = "Local-first body cloning and embodiment service for ModelRig"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ternedal" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pillow>=10.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "httpx>=0.27",
  "httpx2>=2.12.0",
  "numpy>=1.26,<2; python_version < '3.13'",
  "numpy>=2,<3; python_version >= '3.13'",
]

[project.scripts]
bodyrig = "bodyrig.guided_app:run"
bodyrig-recover = "bodyrig.recover_cli:main"
bodyrig-recovery-preflight = "bodyrig.preflight_cli:main"
bodyrig-capture-identity = "bodyrig.identity_capture_cli:main"
bodyrig-identity-capture-preflight = "bodyrig.identity_capture_preflight:main"
bodyrig-fit-avatar = "bodyrig.avatar_cli:main"
bodyrig-fit-avatar-external = "bodyrig.external_fitter_cli:main"
bodyrig-wsl-adapter-bridge = "bodyrig.wsl_adapter_bridge:main"
bodyrig-sith-preflight = "bodyrig.sith_preflight:main"
bodyrig-sith-stage-input = "bodyrig.sith_input:main"
bodyrig-sith-prepare = "bodyrig.sith_prepare:main"
bodyrig-sith-reconstruct = "bodyrig.sith_reconstruct:main"
bodyrig-sith-model-digest = "bodyrig.sith_model:main"
bodyrig-sith-status = "bodyrig.sith_status:main"
bodyrig-sith-setup-report = "bodyrig.sith_setup:main"
bodyrig-rig-setup-report = "bodyrig.rig_setup:main"
bodyrig-sith-fitter = "bodyrig.sith_fitter_orchestrator:main"
bodyrig-stash-sources = "bodyrig.stash_cli:main"
bodyrig-photoreal-stash-inventory = "bodyrig.photoreal_stash_inventory_cli:main"
bodyrig-photoreal-dataset-plan = "bodyrig.photoreal_dataset_plan_cli:main"
bodyrig-photoreal-source-verify = "bodyrig.photoreal_source_verify_cli:main"
bodyrig-photoreal-scan-plan = "bodyrig.photoreal_scan_plan_cli:main"
bodyrig-photoreal-identity-bootstrap = "bodyrig.photoreal_identity_bootstrap_cli:main"
bodyrig-photoreal-identity-extract = "bodyrig.photoreal_identity_extractor_cli:main"
bodyrig-photoreal-identity-bank = "bodyrig.photoreal_identity_bank_cli:main"
bodyrig-photoreal-identity-negative-inventory = "bodyrig.photoreal_identity_negative_inventory_cli:main"
bodyrig-photoreal-identity-negative-verify = "bodyrig.photoreal_identity_negative_verify_cli:main"
bodyrig-photoreal-identity-calibration-plan = "bodyrig.photoreal_identity_calibration_plan_cli:main"
bodyrig-photoreal-identity-calibration-extract = "bodyrig.photoreal_identity_calibration_extractor_cli:main"
bodyrig-photoreal-identity-calibrate = "bodyrig.photoreal_identity_calibration_cli:main"
bodyrig-photoreal-model-set-digest = "bodyrig.photoreal_model_set_cli:main"
bodyrig-photoreal-frame-analyze = "bodyrig.photoreal_frame_analyzer_cli:main"
bodyrig-photoreal-frame-authorize-identity = "bodyrig.photoreal_frame_identity_authority_cli:main"
bodyrig-photoreal-frame-index = "bodyrig.photoreal_frame_index_cli:main"
bodyrig-photoreal-appearance-epoch = "bodyrig.photoreal_appearance_epoch_cli:main"
bodyrig-photoreal-appearance-epoch-review = "bodyrig.photoreal_appearance_epoch_review_cli:main"
bodyrig-photoreal-teacher-input = "bodyrig.photoreal_teacher_input_cli:main"
bodyrig-photoreal-teacher-run = "bodyrig.photoreal_teacher_cli:main"
bodyrig-photoreal-teacher-review-renders = "bodyrig.photoreal_teacher_review_renders_cli:main"
bodyrig-observation-preflight = "bodyrig.observation_preflight:main"
bodyrig-select-observations = "bodyrig.observation_cli:main"
bodyrig-observation-evidence = "bodyrig.observation_evidence:main"
bodyrig-materialize = "bodyrig.materialize_cli:main"
bodyrig-acceptance-status = "bodyrig.acceptance_status_cli:main"
bodyrig-personality-blueprint = "bodyrig.personality_blueprint_cli:main"
bodyrig-personality-exemplars = "bodyrig.personality_exemplars_cli:main"
bodyrig-personality-approve-exemplars = "bodyrig.personality_exemplar_approval_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["bodyrig"]

[tool.hatch.build.targets.wheel.force-include]
"reference-renderer/renderer-contract.json" = "reference-renderer/renderer-contract.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
