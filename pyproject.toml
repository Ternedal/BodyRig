[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bodyrig"
version = "0.1.0"
description = "Local-first body cloning and embodiment service for ModelRig"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ternedal" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
bodyrig = "bodyrig.app:run"
bodyrig-recover = "bodyrig.recover_cli:main"
bodyrig-recovery-preflight = "bodyrig.preflight_cli:main"
bodyrig-fit-avatar = "bodyrig.avatar_cli:main"
bodyrig-materialize = "bodyrig.materialize_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["bodyrig"]

[tool.pytest.ini_options]
testpaths = ["tests"]
