# BodyRig ExAvatar diagnostic-only CI
name: exavatar-diagnostic-ci

on:
  push:
    branches:
      - diag/exavatar-final-symlink-containment-runner
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic-static:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile diagnostic tools
        run: >-
          python -m py_compile
          tools/photoreal_exavatar_scene_scale_diagnostic.py
          tools/photoreal_exavatar_prepare_rasterizer_ab.py
          tools/photoreal_exavatar_scene_scale_ab.py
      - name: Run diagnostic unit tests
        run: >-
          python -m pytest -q
          tests/test_photoreal_exavatar_scene_scale_diagnostic.py
          tests/test_photoreal_exavatar_rasterizer_ab.py
          tests/test_photoreal_exavatar_scene_scale_ab.py
