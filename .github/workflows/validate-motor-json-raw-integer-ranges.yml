name: validate-motor-json-raw-integer-ranges

on:
  push:
    branches:
      - fix/motor-json-raw-integer-ranges-20260911

permissions:
  contents: write

jobs:
  validate:
    if: ${{ github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, '[run-raw-integer-ranges]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/motor-json-raw-integer-ranges-20260911
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply raw integer-range guards
        run: python .github/fix_motor_json_raw_integer_ranges.py
      - name: Install locked test environment
        run: python -m pip install -c requirements/linux-ci-python.lock.txt -e '.[test]'
      - name: Run focused regressions
        shell: bash
        run: |
          python -m pytest -q \
            tests/test_reference_renderer_json_utility_guard.py \
            tests/test_reference_renderer_motor_v2_contract.py \
            tests/test_reference_renderer_motor_v3_contract.py \
            tests/test_reference_renderer_expression_release_contract.py \
            tests/test_reference_renderer_speech_release_contract.py \
            tests/test_reference_renderer_locomotion_release_ownership.py \
            tests/test_reference_renderer_small_shrug_atomicity.py \
            tests/test_reference_renderer_gesture_release_ownership.py
          git diff --check
      - name: Commit clean validation result
        shell: bash
        run: |
          git rm .github/workflows/validate-motor-json-raw-integer-ranges.yml .github/trigger-motor-json-raw-integer-ranges.txt .github/fix_motor_json_raw_integer_ranges.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reference-renderer/Assets/BodyRig/BodyRigJsonUtility.cs tests/test_reference_renderer_json_utility_guard.py
          git commit -m 'Fail closed on raw Motor State integer ranges'
          git push origin HEAD:fix/motor-json-raw-integer-ranges-20260911
