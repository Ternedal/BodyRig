name: fix-json-root-scope-once

on:
  push:
    branches:
      - fix/motor-json-shared-type-guard-20260911

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/motor-json-shared-type-guard-20260911
          fetch-depth: 0
      - name: Apply root-scoped parser patch
        run: python tools/tmp_fix_json_root_scope.py
      - name: Validate focused contracts
        run: |
          python -m pip install --disable-pip-version-check -c requirements/linux-ci-python.lock.txt -e ".[test]"
          python -m pytest -q tests/test_reference_renderer_json_utility_guard.py tests/test_reference_renderer_json_shared_guard.py tests/test_reference_renderer_motor_v2_contract.py tests/test_reference_renderer_motor_v3_contract.py
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference-renderer/Assets/BodyRig/BodyRigJsonUtility.cs tests/test_reference_renderer_json_shared_guard.py tests/test_reference_renderer_json_utility_guard.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Scope raw Motor State validation to root fields"
          git push origin HEAD:fix/motor-json-shared-type-guard-20260911
