name: validate-turn-speed-after-discriminator

on:
  push:
    branches:
      - staging/turn-speed-after-discriminator-20260911

permissions:
  contents: write

jobs:
  validate:
    if: contains(github.event.head_commit.message, '[run-turn-speed-reanchor]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Apply turn-speed schema parity patch
        run: python .github/scripts/apply_turn_speed_after_discriminator.py
      - name: Install locked test environment
        run: python -m pip install --disable-pip-version-check -c requirements/linux-ci-python.lock.txt -e ".[test]"
      - name: Run full Python regressions
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m pytest -q
          git diff --check
      - name: Commit clean validated tree
        shell: bash
        run: |
          rm -f \
            .github/scripts/apply_turn_speed_after_discriminator.py \
            .github/workflows/validate-turn-speed-after-discriminator.yml \
            .github/turn-speed-reanchor.trigger
          git add -A
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/scripts/apply_turn_speed_after_discriminator.py' \
            '.github/turn-speed-reanchor.trigger' \
            '.github/workflows/validate-turn-speed-after-discriminator.yml' \
            'reference-renderer/Assets/BodyRig/BodyRigMotorDriver.cs' \
            'tests/test_reference_renderer_motor_v3_contract.py' \
            'tests/test_reference_renderer_turn_speed_schema_parity.py' | sort)"
          test "$actual" = "$expected" || { echo "unexpected staged files:"; printf '%s\n' "$actual"; exit 1; }
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Align renderer turn-speed range after discriminator gate"
          git push origin HEAD:staging/turn-speed-after-discriminator-20260911
