name: resolve-detectron2-mask-hash

on:
  push:
    branches:
      - feat/photoidentity-phalp-mask-isolation-20260910

permissions:
  contents: read

jobs:
  hash-checkpoint:
    runs-on: ubuntu-24.04
    steps:
      - name: Download exact Detectron2 checkpoint and hash bytes
        shell: bash
        run: |
          set -euo pipefail
          url='https://dl.fbaipublicfiles.com/detectron2/new_baselines/mask_rcnn_regnety_4gf_dds_FPN_400ep_LSJ/42045954/model_final_ef3a80.pkl'
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/model_final_ef3a80.pkl" "$url"
          bytes="$(stat -c '%s' "$RUNNER_TEMP/model_final_ef3a80.pkl")"
          sha="$(sha256sum "$RUNNER_TEMP/model_final_ef3a80.pkl" | awk '{print $1}')"
          echo "DETECTRON2_MASK_CHECKPOINT_URL=$url"
          echo "DETECTRON2_MASK_CHECKPOINT_BYTES=$bytes"
          echo "DETECTRON2_MASK_CHECKPOINT_SHA256=$sha"
          test "$bytes" -gt 1000000
          test "${#sha}" -eq 64
