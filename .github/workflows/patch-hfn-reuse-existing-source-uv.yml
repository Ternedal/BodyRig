name: patch-hfn-reuse-existing-source-uv

on:
  push:
    branches:
      - feat/hfn-reuse-existing-source-uv

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install locked environment
        run: python -m pip install --disable-pip-version-check -c requirements/linux-ci-python.lock.txt -e '.[test]'
      - name: Apply reusable source/UV patch
        run: |
          python scripts/patch_hfn_reusable_detail_authority.py
          python scripts/fix_hfn_reusable_test_fixture.py
      - name: Compile changed Python
        run: >-
          python -m py_compile
          bodyrig/hfn_reusable_detail_authority.py
          bodyrig/high_fidelity_hfn_continuation.py
          bodyrig/fidelity_component_gap_executor.py
          tests/test_hfn_reusable_detail_authority.py
          tests/test_high_fidelity_hfn_continuation.py
          tests/test_fidelity_component_gap_executor.py
      - name: Run focused reusable authority regressions
        run: >-
          python -m pytest -q
          tests/test_hfn_reusable_detail_authority.py
          tests/test_high_fidelity_hfn_continuation.py
          tests/test_fidelity_component_gap_executor.py
          tests/test_hands_feet_nails_detail_candidate.py
          tests/test_hands_feet_nails_uv_domain_lineage.py
          tests/test_hands_feet_nails_uv_domain_evidence.py
          tests/test_hfn_underlying_v1_validators.py
      - name: Validate product diff boundary
        shell: bash
        run: |
          git diff --check
          mapfile -t files < <(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sort -u
          )
          expected=(
            bodyrig/fidelity_component_gap_executor.py
            bodyrig/hfn_reusable_detail_authority.py
            bodyrig/high_fidelity_hfn_continuation.py
            tests/test_fidelity_component_gap_executor.py
            tests/test_hfn_reusable_detail_authority.py
            tests/test_high_fidelity_hfn_continuation.py
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "${files[*]}" != "${expected_sorted[*]}" ]]; then
            printf 'Unexpected product diff:\n%s\n' "${files[*]}"
            exit 1
          fi
      - name: Commit product patch and remove helpers
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            bodyrig/fidelity_component_gap_executor.py \
            bodyrig/hfn_reusable_detail_authority.py \
            bodyrig/high_fidelity_hfn_continuation.py \
            tests/test_fidelity_component_gap_executor.py \
            tests/test_hfn_reusable_detail_authority.py \
            tests/test_high_fidelity_hfn_continuation.py
          git rm -f \
            scripts/patch_hfn_reusable_detail_authority.py \
            scripts/fix_hfn_reusable_test_fixture.py \
            .github/workflows/patch-hfn-reuse-existing-source-uv.yml
          git commit -m 'Reuse one exact existing HFN source UV authority'
          git push
