name: temp-renderer-runtime-hash-gate

on:
  push:
    branches:
      - staging/renderer-runtime-hash-20260911
    paths:
      - '.github/workflows/temp-renderer-runtime-hash-gate.yml'
      - '.github/scripts/temp_renderer_runtime_hash_patch.py'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply exact patch
        run: python .github/scripts/temp_renderer_runtime_hash_patch.py
      - name: Parse acceptance scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [void][scriptblock]::Create((Get-Content -LiteralPath ./record-renderer-acceptance.ps1 -Raw))
          [void][scriptblock]::Create((Get-Content -LiteralPath ./tests/test-complete-acceptance.ps1 -Raw))
      - name: Run complete acceptance regression
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -NonInteractive -File ./tests/test-complete-acceptance.ps1
      - name: Diff check
        shell: bash
        run: git diff --check
      - name: Commit product patch
        shell: bash
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add record-renderer-acceptance.ps1 tests/test-complete-acceptance.ps1
          git commit -m 'Bind renderer acceptance to runtime payload hashes'
          git push origin HEAD:staging/renderer-runtime-hash-20260911
