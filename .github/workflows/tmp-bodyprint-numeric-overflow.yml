name: tmp-bodyprint-numeric-overflow

on:
  push:
    branches:
      - staging/bodyprint-numeric-overflow-20260912

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Apply BodyPrint numeric overflow patch
        run: python .github/scripts/tmp_bodyprint_numeric_overflow_patch.py
      - name: Install locked test environment
        run: python -m pip install --disable-pip-version-check -c requirements/linux-ci-python.lock.txt -e ".[test]"
      - name: Validate full suite and clean diff
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m compileall -q bodyrig tests
          python -m pytest -q
          git diff --check
          python - <<'PY'
          import subprocess
          expected = {"bodyrig/package.py", "tests/test_package.py"}
          changed = {
              line.strip()
              for line in subprocess.check_output(
                  ["git", "diff", "--name-only"], text=True
              ).splitlines()
              if line.strip()
          }
          if changed != expected:
              raise SystemExit(f"unexpected product diff: {sorted(changed)} != {sorted(expected)}")
          print("Product diff: PASS | " + ", ".join(sorted(changed)))
          PY
      - name: Publish validated candidate tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bodyrig/package.py tests/test_package.py
          git commit -m "Fail closed on huge BodyPrint numeric values"
          git push origin HEAD:staging/bodyprint-numeric-overflow-20260912
