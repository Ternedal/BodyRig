name: fix-gesture-posture-overlap

on:
  push:
    branches:
      - fix/gesture-release-ownership-20260911

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/gesture-release-ownership-20260911
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Fix ownership preparation order and add overlap regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          driver = Path('reference-renderer/Assets/BodyRig/BodyRigMotorDriver.cs')
          source = driver.read_text(encoding='utf-8')
          old = '''            PreparePostureOwnershipForFrame(performedPosture, sourceNaturalPosture);\n            PrepareGestureOwnershipForFrame(\n                gestureOwnsLeftShoulder,\n                gestureOwnsRightShoulder,\n                gestureOwnsRightUpperArm,\n                gestureOwnsRightLowerArm);\n'''
          new = '''            // Gesture release must happen before posture ownership observes\n            // overlapping shoulder channels. Otherwise a natural posture can\n            // retain a released shrug as its later release baseline.\n            PrepareGestureOwnershipForFrame(\n                gestureOwnsLeftShoulder,\n                gestureOwnsRightShoulder,\n                gestureOwnsRightUpperArm,\n                gestureOwnsRightLowerArm);\n            PreparePostureOwnershipForFrame(performedPosture, sourceNaturalPosture);\n'''
          if source.count(old) != 1:
              raise SystemExit(f'expected one ownership-order block, found {source.count(old)}')
          driver.write_text(source.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/test_reference_renderer_gesture_release_ownership.py')
          test = test_path.read_text(encoding='utf-8')
          marker = 'def test_gesture_release_refreshes_overlapping_posture_baseline_before_posture_uses_it()'
          if marker not in test:
              test += '''\n\ndef test_gesture_release_refreshes_overlapping_posture_baseline_before_posture_uses_it() -> None:\n    source = DRIVER.read_text(encoding="utf-8")\n    late_update = source[\n        source.index("private void LateUpdate()") :\n        source.index("private void BindAvatarIfNeeded()")\n    ]\n\n    gesture_prepare = late_update.index("PrepareGestureOwnershipForFrame(")\n    posture_prepare = late_update.index("PreparePostureOwnershipForFrame(performedPosture, sourceNaturalPosture);")\n    assert gesture_prepare < posture_prepare\n\n    # Model the exact overlap regression: natural posture acquired its baseline\n    # while a shrug was lifted; ending the shrug must be visible to posture\n    # preparation on that same frame, so ending posture later cannot resurrect it.\n    gesture_release_baseline = 0.0\n    shrugged_shoulder = 0.02\n    posture_release_baseline = shrugged_shoulder\n    posture_applied_last_frame = shrugged_shoulder\n    current_shoulder = shrugged_shoulder\n\n    # Gesture preparation releases BodyRig's still-owned shrug first.\n    current_shoulder = gesture_release_baseline\n\n    # Posture preparation now observes that its previous composed value changed\n    # and refreshes the release baseline to the de-shrugged shoulder.\n    posture_still_bodyrig = current_shoulder == posture_applied_last_frame\n    if not posture_still_bodyrig:\n        posture_release_baseline = current_shoulder\n\n    # When posture ends on a later frame, it must restore the de-shrugged value.\n    current_shoulder = posture_release_baseline\n    assert current_shoulder == gesture_release_baseline\n    assert current_shoulder != shrugged_shoulder\n'''
              test_path.write_text(test, encoding='utf-8')
          PY
      - name: Install locked Linux test environment
        run: python -m pip install --disable-pip-version-check -c requirements/linux-ci-python.lock.txt -e ".[test]"
      - name: Run ownership regressions
        run: >-
          python -m pytest -q
          tests/test_reference_renderer_gesture_release_ownership.py
          tests/test_reference_renderer_motor_v3_contract.py
          tests/test_reference_renderer_motor_v2_contract.py
          tests/test_reference_renderer_expression_release_contract.py
          tests/test_reference_renderer_speech_release_contract.py
      - name: Check whitespace
        run: git diff --check
      - name: Commit fix without temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-gesture-posture-overlap.yml
          git add reference-renderer/Assets/BodyRig/BodyRigMotorDriver.cs tests/test_reference_renderer_gesture_release_ownership.py
          git commit -m "Fix gesture posture release overlap"
          git push origin HEAD:fix/gesture-release-ownership-20260911
