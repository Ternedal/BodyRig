name: validate-motor-json-root-schema-parity

on:
  push:
    branches:
      - fix/motor-json-root-schema-parity-work-20260911

permissions:
  contents: write

jobs:
  validate:
    if: contains(github.event.head_commit.message, '[run-root-schema-parity]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Apply root schema parity guard
        run: python .github/scripts/apply_motor_json_root_schema_parity.py
      - name: Install locked test environment
        run: python -m pip install --disable-pip-version-check -c requirements/linux-ci-python.lock.txt -e ".[test]"
      - name: Run focused regressions
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m pytest -q \
            tests/test_reference_renderer_json_utility_guard.py \
            tests/test_reference_renderer_motor_v2_contract.py \
            tests/test_reference_renderer_motor_v3_contract.py \
            tests/test_reference_renderer_expression_release_ownership.py \
            tests/test_reference_renderer_speech_release_ownership.py \
            tests/test_reference_renderer_locomotion_release_ownership.py \
            tests/test_reference_renderer_small_shrug_atomicity.py \
            tests/test_reference_renderer_gesture_release_ownership.py \
            tests/test_motor_state_v2.py \
            tests/test_motor_state_v3.py
          git diff --check
      - name: Commit clean validation result
        shell: bash
        run: |
          rm -f .github/scripts/apply_motor_json_root_schema_parity.py
          rm -f .github/workflows/validate-motor-json-root-schema-parity.yml
          rm -f .github/root-schema-parity.trigger
          git add -A
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            'reference-renderer/Assets/BodyRig/BodyRigJsonUtility.cs' \
            'tests/test_reference_renderer_json_utility_guard.py' | sort)"
          test "$actual" = "$expected" || { echo "unexpected staged files:"; printf '%s\n' "$actual"; exit 1; }
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Enforce Motor State root schema parity"
          git push origin HEAD:fix/motor-json-root-schema-parity-work-20260911
