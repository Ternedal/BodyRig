name: exact-head-qualification

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      head_sha:
        description: Exact commit SHA to qualify
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: bodyrig-exact-head-${{ inputs.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  linux-core:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_SHA: ${{ inputs.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_SHA }}
      - name: Assert exact checkout authority
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA" || { echo "checkout mismatch: $actual != $EXPECTED_SHA" >&2; exit 1; }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install locked Linux test environment
        run: python -m pip install --disable-pip-version-check -c requirements/linux-ci-python.lock.txt -e ".[test]"
      - name: Verify dependency lock
        run: |
          python -m pip check
          python -m compileall -q bodyrig tests
      - name: Run full Python suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q
      - name: Assert clean tree
        shell: bash
        run: test -z "$(git status --porcelain)" || { git status --short; exit 1; }

  windows-acceptance:
    runs-on: windows-2025
    env:
      EXPECTED_SHA: ${{ inputs.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_SHA }}
      - name: Assert exact checkout authority
        shell: pwsh
        run: |
          $actual = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:EXPECTED_SHA.ToLowerInvariant()) {
            throw "checkout mismatch: $actual != $env:EXPECTED_SHA"
          }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install locked Windows test environment
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -c requirements/windows-python.lock.txt -e ".[test]"
      - name: Verify runtime lock
        shell: pwsh
        run: python -m bodyrig.runtime_lock --lock requirements/windows-python.lock.txt
      - name: Run full Python suite
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q
      - name: Run final acceptance gate tests
        shell: pwsh
        run: ./tests/test-complete-acceptance.ps1
      - name: Assert clean tree
        shell: pwsh
        run: |
          $dirty = @(& git status --porcelain)
          if ($dirty.Count -gt 0) { $dirty | ForEach-Object { Write-Host $_ }; throw "tests dirtied checkout" }
