name: focused-wardrobe-source-capture-v1

on:
  push:
    branches: [fix/wardrobe-source-capture-v1]

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Assert exact checkout authority
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install locked Linux test environment
        run: python -m pip install --disable-pip-version-check -c requirements/linux-ci-python.lock.txt -e ".[test]"
      - name: Apply focused patch
        run: python .github/patch_wardrobe_source_capture_v1.py
      - name: Compile
        run: python -m py_compile bodyrig/wardrobe_source_capture.py tests/test_wardrobe_source_capture.py
      - name: Focused tests
        run: python -m pytest -q tests/test_wardrobe_source_capture.py tests/test_wardrobe_release_authority.py
      - name: Enforce diff boundary
        shell: bash
        run: |
          git diff --check
          mapfile -t changed < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          printf '%s\n' "${changed[@]}"
          expected=(
            bodyrig/wardrobe_source_capture.py
            tests/test_wardrobe_source_capture.py
            .github/patch_wardrobe_source_capture_v1.py
            .github/workflows/focused-wardrobe-source-capture-v1.yml
          )
          for path in "${changed[@]}"; do
            printf '%s\n' "${expected[@]}" | grep -Fx -- "$path" >/dev/null || { echo "unexpected diff path: $path" >&2; exit 1; }
          done
      - name: Commit validated product patch and self-clean helper
        shell: bash
        run: |
          rm .github/patch_wardrobe_source_capture_v1.py .github/workflows/focused-wardrobe-source-capture-v1.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Reject boolean v1 in wardrobe source-capture readback (#779)"
          git push origin HEAD:fix/wardrobe-source-capture-v1
