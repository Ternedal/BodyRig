name: tmp-run-low-level-v1-near-one
on:
  push:
    branches:
      - fix/low-level-physical-v1-bool-hardening-20260913
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/low-level-physical-v1-bool-hardening-20260913
          fetch-depth: 0
      - name: Apply patch
        run: python tools/tmp_fix_low_level_v1_near_one.py
      - name: Revert unrelated upstream file
        run: git checkout origin/main -- check-reference-renderer-ready.ps1
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add run-windows-renderer-probe.ps1 run-quest-renderer-probe.ps1 record-renderer-acceptance.ps1 tests/test_low_level_physical_v1_bool_hardening.py check-reference-renderer-ready.ps1
          git commit -m 'Reject near-one low-level physical v1 evidence'
          git push origin HEAD:fix/low-level-physical-v1-bool-hardening-20260913
