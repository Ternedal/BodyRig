name: tmp-bodyprint-adjustment-numeric

on:
  push:
    branches:
      - staging/bodyprint-adjustment-numeric-sol-20260912

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Apply BodyPrint adjustment numeric fix
        run: python .github/scripts/tmp_bodyprint_adjustment_numeric.py
      - name: Install locked Linux test environment
        run: |
          python -m pip install --disable-pip-version-check -c requirements/linux-ci-python.lock.txt -e ".[test]"
          python -m pip check
      - name: Validate focused and full suites
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m compileall -q bodyrig tests
          python -m pytest -q tests/test_bodyprint_adjustment_numeric_boundaries.py
          python -m pytest -q
          git diff --check
          python - <<'PY'
          import subprocess
          expected = {
              "bodyrig/bridges/bodyprint_shape_adjust.py",
              "tests/test_bodyprint_adjustment_numeric_boundaries.py",
          }
          tracked = {
              line.strip()
              for line in subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
              if line.strip()
          }
          untracked = {
              line.strip()
              for line in subprocess.check_output(
                  ["git", "ls-files", "--others", "--exclude-standard"], text=True
              ).splitlines()
              if line.strip()
          }
          changed = tracked | untracked
          if changed != expected:
              raise SystemExit(f"unexpected product diff: {sorted(changed)} != {sorted(expected)}")
          print("Product diff: PASS | " + ", ".join(sorted(changed)))
          PY
      - name: Publish validated staging product tree
        run: |
          rm .github/workflows/tmp-bodyprint-adjustment-numeric.yml
          rm .github/scripts/tmp_bodyprint_adjustment_numeric.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fail closed on BodyPrint adjustment numeric coercion"
          git push origin HEAD:staging/bodyprint-adjustment-numeric-sol-20260912
