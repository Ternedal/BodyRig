name: fix-pr275-platform-neutral-retirement
on:
  push:
    branches:
      - chore/retire-ab-cycle-v1-20260910
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chore/retire-ab-cycle-v1-20260910
          fetch-depth: 0
      - name: Patch lifecycle authority
        shell: python
        run: |
          from pathlib import Path
          import json

          module = Path('bodyrig/ab_baseline_candidates.py')
          text = module.read_text(encoding='utf-8')
          text = text.replace(
              'CYCLE_STATE_FORMAT = "bodyrig-ab-baseline-cycle-state"\nCYCLE_STATE_FIELDS = {',
              'CYCLE_STATE_FORMAT = "bodyrig-ab-baseline-cycle-state"\n'
              'HISTORICAL_V1_CYCLE_ID = "pbr-v3-throughput-v3-20260910"\n'
              'HISTORICAL_V1_CONTRACT_GIT_BLOB = "703187fc8584cb3300f61d9ddb73eb886c27513f"\n'
              'HISTORICAL_V1_WINDOWS_CONTRACT_SHA256 = "fa9ee08c715c216a4dce90e85a2bd699ed56f73eaad5f3fa444cd625110f6cf4"\n'
              'HISTORICAL_V1_PBR_REVISION = "fe2db94b8ae3be51938a7b302361bcf5fdec5f48"\n'
              'HISTORICAL_V1_THROUGHPUT_REVISION = "5fa01deb08399fda64e83db1329d4d2e83ad1bc2"\n'
              'HISTORICAL_V1_PROMOTION_RECEIPT_SHA256 = "2daac171b018b0bdb813fb4698c17fa882ef8d130cd9df0ab7e87d7282c9850d"\n'
              'CYCLE_STATE_FIELDS = {'
          )
          text = text.replace(
              '    "candidate_contract_sha256",\n',
              '    "candidate_contract_git_blob",\n    "historical_windows_candidate_contract_sha256",\n'
          )
          start = text.index('def _assert_cycle_open(')
          end = text.index('\n\ndef _validate_contract', start)
          replacement = '''def _assert_cycle_open(repo_root: Path) -> None:
              path = repo_root / CYCLE_STATE_RELATIVE_PATH
              if not path.is_file():
                  raise AbBaselineCandidateError(
                      "A/B lifecycle state is missing; current v1 candidate authority cannot be assumed active. "
                      "Create a new versioned candidate contract and lifecycle state before starting another A/B baseline."
                  )
              try:
                  value = json.loads(path.read_text(encoding="utf-8-sig"))
              except (OSError, UnicodeDecodeError, json.JSONDecodeError) as exc:
                  raise AbBaselineCandidateError("A/B lifecycle state is not valid UTF-8 JSON") from exc
              if not isinstance(value, dict) or set(value) != CYCLE_STATE_FIELDS:
                  raise AbBaselineCandidateError("A/B lifecycle state fields do not match the canonical v1 lifecycle contract")
              if value.get("format") != CYCLE_STATE_FORMAT or value.get("version") != 1:
                  raise AbBaselineCandidateError("A/B lifecycle state format/version mismatch")
              if value.get("cycle_id") != HISTORICAL_V1_CYCLE_ID:
                  raise AbBaselineCandidateError("A/B lifecycle state cycle id differs from the completed v1 cycle")
              if value.get("candidate_contract_path") != CONTRACT_RELATIVE_PATH.as_posix():
                  raise AbBaselineCandidateError("A/B lifecycle state does not bind the historical v1 candidate contract")

              expected_blob = _revision(value.get("candidate_contract_git_blob"), "completed-cycle candidate contract Git blob")
              if expected_blob != HISTORICAL_V1_CONTRACT_GIT_BLOB:
                  raise AbBaselineCandidateError("A/B lifecycle state does not bind the canonical historical v1 contract Git blob")
              actual_blob = _tree_blob(repo_root, "HEAD", CONTRACT_RELATIVE_PATH.as_posix())
              if actual_blob != expected_blob:
                  raise AbBaselineCandidateError("historical A/B v1 candidate contract Git blob changed after cycle completion")

              windows_sha = str(value.get("historical_windows_candidate_contract_sha256") or "").strip().lower()
              if _SHA256_RE.fullmatch(windows_sha) is None or windows_sha != HISTORICAL_V1_WINDOWS_CONTRACT_SHA256:
                  raise AbBaselineCandidateError("A/B lifecycle state lost the historical Windows candidate-contract evidence SHA-256")

              pbr_revision = _revision(value.get("pbr_candidate_revision"), "completed-cycle PBR candidate revision")
              throughput_revision = _revision(value.get("throughput_candidate_revision"), "completed-cycle throughput candidate revision")
              if pbr_revision != HISTORICAL_V1_PBR_REVISION or throughput_revision != HISTORICAL_V1_THROUGHPUT_REVISION:
                  raise AbBaselineCandidateError("A/B lifecycle state candidate revisions differ from the completed reviewed cycle")

              promotion_sha = str(value.get("promotion_receipt_sha256") or "").strip().lower()
              if _SHA256_RE.fullmatch(promotion_sha) is None or promotion_sha != HISTORICAL_V1_PROMOTION_RECEIPT_SHA256:
                  raise AbBaselineCandidateError("completed A/B cycle promotion receipt SHA-256 differs from canonical authority")
              if (
                  value.get("historical_contract_immutable") is not True
                  or value.get("future_cycle_requires_new_contract_version") is not True
                  or value.get("comparison_only") is not True
                  or value.get("physical_acceptance_authority") is not False
                  or value.get("production_activation") is not False
                  or value.get("release_authority") is not False
              ):
                  raise AbBaselineCandidateError("A/B lifecycle state crosses the historical comparison-only authority boundary")
              state = str(value.get("state") or "").strip()
              if state == "completed-promoted":
                  raise AbBaselineCandidateError(
                      "A/B candidate cycle v1 is completed/promoted and archived; historical contract "
                      f"{CONTRACT_RELATIVE_PATH.as_posix()} remains immutable at Git blob {actual_blob}; "
                      f"the original Windows evidence fingerprint remains SHA-256 {windows_sha}. "
                      "Create a new versioned candidate contract and lifecycle state before starting another A/B baseline."
                  )
              raise AbBaselineCandidateError(
                  f"A/B lifecycle state '{state}' is not an open cycle supported by the v1 launcher; "
                  "create/wire a new versioned candidate contract before starting another A/B baseline."
              )
          '''
          replacement = '\n'.join(line[12:] if line.startswith('            ') else line for line in replacement.splitlines())
          text = text[:start] + replacement.rstrip() + text[end:]
          text = text.replace('_assert_cycle_open(repo, contract_sha256)', '_assert_cycle_open(repo)')
          module.write_text(text, encoding='utf-8', newline='\n')

          lifecycle_path = Path('contracts/ab-baseline-cycle-state-v1.json')
          lifecycle = json.loads(lifecycle_path.read_text(encoding='utf-8'))
          lifecycle.pop('candidate_contract_sha256', None)
          ordered = {
              'format': lifecycle['format'],
              'version': lifecycle['version'],
              'cycle_id': lifecycle['cycle_id'],
              'state': lifecycle['state'],
              'candidate_contract_path': lifecycle['candidate_contract_path'],
              'candidate_contract_git_blob': '703187fc8584cb3300f61d9ddb73eb886c27513f',
              'historical_windows_candidate_contract_sha256': 'fa9ee08c715c216a4dce90e85a2bd699ed56f73eaad5f3fa444cd625110f6cf4',
              'pbr_candidate_revision': lifecycle['pbr_candidate_revision'],
              'throughput_candidate_revision': lifecycle['throughput_candidate_revision'],
              'promotion_receipt_sha256': lifecycle['promotion_receipt_sha256'],
              'historical_contract_immutable': lifecycle['historical_contract_immutable'],
              'future_cycle_requires_new_contract_version': lifecycle['future_cycle_requires_new_contract_version'],
              'comparison_only': lifecycle['comparison_only'],
              'physical_acceptance_authority': lifecycle['physical_acceptance_authority'],
              'production_activation': lifecycle['production_activation'],
              'release_authority': lifecycle['release_authority'],
          }
          lifecycle_path.write_text(json.dumps(ordered, indent=2) + '\n', encoding='utf-8', newline='\n')

          tests = Path('tests/test_ab_baseline_candidates.py')
          t = tests.read_text(encoding='utf-8')
          test_start = t.index('def test_completed_v1_cycle_blocks_new_baseline_without_rewriting_historical_contract()')
          test_replacement = '''def test_completed_v1_cycle_blocks_new_baseline_without_rewriting_historical_contract() -> None:
              lifecycle_path = ROOT / "contracts" / "ab-baseline-cycle-state-v1.json"
              lifecycle = json.loads(lifecycle_path.read_text(encoding="utf-8"))

              assert lifecycle == {
                  "format": "bodyrig-ab-baseline-cycle-state",
                  "version": 1,
                  "cycle_id": "pbr-v3-throughput-v3-20260910",
                  "state": "completed-promoted",
                  "candidate_contract_path": "contracts/ab-baseline-candidates-v1.json",
                  "candidate_contract_git_blob": "703187fc8584cb3300f61d9ddb73eb886c27513f",
                  "historical_windows_candidate_contract_sha256": "fa9ee08c715c216a4dce90e85a2bd699ed56f73eaad5f3fa444cd625110f6cf4",
                  "pbr_candidate_revision": "fe2db94b8ae3be51938a7b302361bcf5fdec5f48",
                  "throughput_candidate_revision": "5fa01deb08399fda64e83db1329d4d2e83ad1bc2",
                  "promotion_receipt_sha256": "2daac171b018b0bdb813fb4698c17fa882ef8d130cd9df0ab7e87d7282c9850d",
                  "historical_contract_immutable": True,
                  "future_cycle_requires_new_contract_version": True,
                  "comparison_only": True,
                  "physical_acceptance_authority": False,
                  "production_activation": False,
                  "release_authority": False,
              }
              assert ab._tree_blob(ROOT, "HEAD", lifecycle["candidate_contract_path"]) == lifecycle["candidate_contract_git_blob"]
              with pytest.raises(ab.AbBaselineCandidateError, match="completed/promoted and archived"):
                  ab._assert_cycle_open(ROOT)


          def test_completed_cycle_ignores_platform_working_tree_line_endings(monkeypatch, tmp_path: Path) -> None:
              repo = tmp_path / "repo"
              contract = repo / "contracts" / "ab-baseline-candidates-v1.json"
              state = repo / "contracts" / "ab-baseline-cycle-state-v1.json"
              contract.parent.mkdir(parents=True)
              contract.write_bytes(b"windows-style\\r\\nworking-tree\\r\\n")
              state.write_text((ROOT / "contracts" / "ab-baseline-cycle-state-v1.json").read_text(encoding="utf-8"), encoding="utf-8")
              monkeypatch.setattr(ab, "_tree_blob", lambda _repo, revision, path: ab.HISTORICAL_V1_CONTRACT_GIT_BLOB)
              with pytest.raises(ab.AbBaselineCandidateError, match="completed/promoted and archived"):
                  ab._assert_cycle_open(repo)


          def test_new_baseline_lifecycle_check_rejects_historical_contract_tamper(monkeypatch, tmp_path: Path) -> None:
              repo = tmp_path / "repo"
              state = repo / "contracts" / "ab-baseline-cycle-state-v1.json"
              state.parent.mkdir(parents=True)
              state.write_text((ROOT / "contracts" / "ab-baseline-cycle-state-v1.json").read_text(encoding="utf-8"), encoding="utf-8")
              monkeypatch.setattr(ab, "_tree_blob", lambda _repo, revision, path: "0" * 40)
              with pytest.raises(ab.AbBaselineCandidateError, match="historical A/B v1 candidate contract Git blob changed"):
                  ab._assert_cycle_open(repo)
          '''
          test_replacement = '\n'.join(line[12:] if line.startswith('            ') else line for line in test_replacement.splitlines())
          t = t[:test_start] + test_replacement.rstrip() + '\n'
          tests.write_text(t, encoding='utf-8', newline='\n')

          # Keep docs explicit about the two identities so operators do not conflate them again.
          doc = Path('docs/AB_BASELINE.md')
          d = doc.read_text(encoding='utf-8')
          old = '> **A/B v1 lifecycle — completed 2026-09-10.** The PBR-v3 / recovery-throughput-v3 shared comparison cycle is finished and promoted under receipt SHA-256 `2daac171b018b0bdb813fb4698c17fa882ef8d130cd9df0ab7e87d7282c9850d`. `contracts/ab-baseline-candidates-v1.json` is now immutable historical evidence; it is not an active candidate contract.'
          new = old + ' Repository immutability is bound by Git blob `703187fc8584cb3300f61d9ddb73eb886c27513f`; the original Windows run recorded checkout-byte SHA-256 `fa9ee08c715c216a4dce90e85a2bd699ed56f73eaad5f3fa444cd625110f6cf4`, which is retained as historical evidence rather than reused as a cross-platform file hash.'
          if old not in d:
              raise SystemExit('AB_BASELINE retirement paragraph anchor missing')
          doc.write_text(d.replace(old, new), encoding='utf-8', newline='\n')

          # Remove this one-shot workflow from the resulting branch commit.
          Path('.github/workflows/_fix_pr275_platform_neutral_retirement.yml').unlink()
      - name: Verify focused regression
        run: |
          python -m compileall -q bodyrig tests
          python -m pytest -q tests/test_ab_baseline_candidates.py tests/test_ab_baseline_launcher_contract.py
          git diff --check
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make A/B v1 retirement identity platform-neutral'
          git push origin HEAD:chore/retire-ab-cycle-v1-20260910
