name: tmp-turn-speed-underflow

on:
  push:
    branches:
      - staging/turn-speed-underflow-20260911

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: staging/turn-speed-underflow-20260911
          fetch-depth: 0
      - name: Apply turn-speed underflow parity fix
        run: python tools/tmp_patch_turn_speed_underflow.py
      - name: Install locked test environment
        run: python -m pip install --disable-pip-version-check -c requirements/linux-ci-python.lock.txt -e ".[test]"
      - name: Validate full locked Python suite
        run: |
          python -m pytest -q
          git diff --check
      - name: Commit real patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference-renderer/Assets/BodyRig/BodyRigMotorDriver.cs tests/test_reference_renderer_turn_speed_schema_parity.py
          git commit -m "Preserve positive turn speed across float underflow"
          git push origin HEAD:staging/turn-speed-underflow-20260911
