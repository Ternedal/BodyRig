name: tmp-personality-blueprint-boundary

on:
  push:
    branches:
      - staging/personality-blueprint-boundary-20260912

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Apply personality blueprint trust-boundary fix
        run: python .github/scripts/tmp_personality_blueprint_boundary.py
      - name: Install locked Linux test environment
        run: python -m pip install --disable-pip-version-check -c requirements/linux-ci-python.lock.txt -e ".[test]"
      - name: Validate full suite and product diff
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m compileall -q bodyrig tests
          python -m pytest -q
          git diff --check
          python - <<'PY'
          import subprocess
          expected = {
              "bodyrig/personality_blueprint.py",
              "tests/test_personality_blueprint.py",
              "tests/test_personality_embodiment_binding.py",
          }
          changed = {
              line.strip()
              for line in subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
              if line.strip()
          }
          if changed != expected:
              raise SystemExit(f"unexpected product diff: {sorted(changed)} != {sorted(expected)}")
          print("Product diff: PASS | " + ", ".join(sorted(changed)))
          PY
      - name: Publish validated staging product tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/scripts/tmp_personality_blueprint_boundary.py .github/workflows/tmp-personality-blueprint-boundary.yml
          git add bodyrig/personality_blueprint.py tests/test_personality_blueprint.py tests/test_personality_embodiment_binding.py
          git diff --cached --check
          git commit -m 'Harden personality blueprint JSON trust boundary'
          git push origin HEAD:staging/personality-blueprint-boundary-20260912
          test "$(git diff --name-only 7bfe7ae2fd4bf3450d6bc85be9e9d15a10ae5635..HEAD | sort | tr '\n' ' ')" = "bodyrig/personality_blueprint.py tests/test_personality_blueprint.py tests/test_personality_embodiment_binding.py "
