name: retire-ab-cycle-v1-apply

on:
  push:
    branches:
      - chore/retire-ab-cycle-v1-20260910

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout retirement branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chore/retire-ab-cycle-v1-20260910
          fetch-depth: 0

      - name: Apply exact lifecycle retirement changes
        run: python tools/_retire_ab_cycle_v1_patch.py

      - name: Commit permanent retirement changes only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Retire completed A/B candidate cycle v1"
          git push origin HEAD:chore/retire-ab-cycle-v1-20260910
