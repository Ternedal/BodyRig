name: post-physical-ab-hardening-apply

on:
  push:
    branches:
      - fix/post-physical-ab-operator-hardening-20260910

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/post-physical-ab-operator-hardening-20260910
          fetch-depth: 0

      - name: Apply exact reviewed hardening transforms
        run: python tools/_post_physical_ab_hardening_patch.py

      - name: Commit permanent fixes only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden operator paths after physical A/B"
          git push origin HEAD:fix/post-physical-ab-operator-hardening-20260910
