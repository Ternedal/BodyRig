name: tmp-patch-gaze-target-schema-parity

on:
  push:
    branches:
      - staging/gaze-target-schema-parity-20260911

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: staging/gaze-target-schema-parity-20260911
          fetch-depth: 0
      - name: Apply gaze target schema parity fix
        run: python tools/tmp_patch_gaze_target_schema_parity.py
      - name: Install locked test environment
        run: python -m pip install --disable-pip-version-check -c requirements/linux-ci-python.lock.txt -e ".[test]"
      - name: Validate focused contracts
        run: |
          python -m pytest -q \
            tests/test_reference_renderer_gaze_target_schema_parity.py \
            tests/test_reference_renderer_gaze_residual_contract.py \
            tests/test_reference_renderer_missing_gaze_residual_contract.py \
            tests/test_reference_renderer_head_rotation_release_ownership.py \
            tests/test_reference_renderer_json_utility_guard.py \
            tests/test_reference_renderer_motor_v2_contract.py \
            tests/test_reference_renderer_motor_v3_contract.py
          git diff --check
      - name: Commit real patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            reference-renderer/Assets/BodyRig/BodyRigMotorDriver.cs \
            tests/test_reference_renderer_gaze_target_schema_parity.py
          git commit -m "Align gaze target presence with Motor State schemas"
          git push origin HEAD:staging/gaze-target-schema-parity-20260911
