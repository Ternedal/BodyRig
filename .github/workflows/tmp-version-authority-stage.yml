name: tmp-version-authority-stage

on:
  push:
    branches: [fix/version-authority-stage-20260911]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/version-authority-stage-20260911
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Apply version authority patch
        run: python tools/tmp_patch_version_authority.py
      - name: Install locked test environment
        run: python -m pip install --disable-pip-version-check -c requirements/linux-ci-python.lock.txt -e ".[test]"
      - name: Run full locked Python suite
        run: python -m pytest -q
      - name: Check diff hygiene
        run: git diff --check
      - name: Commit validated product patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference-renderer/Assets/BodyRig/BodyRigJsonUtility.cs \
                  reference-renderer/Assets/BodyRig/BodyRigMotorDriver.cs \
                  tests/test_reference_renderer_json_utility_guard.py \
                  tests/test_reference_renderer_json_whitespace_guard.py \
                  tests/test_reference_renderer_raw_numeric_ranges.py \
                  tests/test_reference_renderer_version_schema_parity.py \
                  tests/test_reference_renderer_motor_v2_contract.py \
                  tests/test_reference_renderer_version_authority.py
          git commit -m "Preserve raw Motor State version authority"
          git push origin HEAD:fix/version-authority-stage-20260911
