name: validate-evening-canonical-hfn-root-exact

on:
  push:
    branches:
      - validate/evening-canonical-hfn-root-exact

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: validate/evening-canonical-hfn-root-exact
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install locked environment
        run: python -m pip install --disable-pip-version-check -c requirements/linux-ci-python.lock.txt -e ".[test]"
      - name: Apply exact canonical HFN root patch
        run: python .github/patch_evening_canonical_hfn_root.py
      - name: Parse PowerShell and compile regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('run-fidelity-evening.ps1', [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          python -m py_compile tests/test_fidelity_evening_hfn_context_derivation.py tests/test_fidelity_evening_component_gap_execution.py
      - name: Run focused evening HFN regressions
        run: >-
          python -m pytest -q
          tests/test_fidelity_evening_command.py
          tests/test_fidelity_evening_component_gap_execution.py
          tests/test_fidelity_evening_hfn_context_derivation.py
          tests/test_fidelity_component_gap_executor.py
          tests/test_component_gap_face_preview_lineage.py
          tests/test_high_fidelity_hfn_continuation.py
          tests/test_hfn_fingernail_geometry_continuation.py
          tests/test_hfn_toenail_materialization_contract.py
          tests/test_hfn_continuation_version_bool.py
      - name: Validate product boundary
        run: |
          git diff --check -- run-fidelity-evening.ps1 tests/test_fidelity_evening_hfn_context_derivation.py tests/test_fidelity_evening_component_gap_execution.py
          actual="$(git diff --name-only | sort -u)"
          expected="$(printf '%s\n' run-fidelity-evening.ps1 tests/test_fidelity_evening_hfn_context_derivation.py tests/test_fidelity_evening_component_gap_execution.py | sort)"
          test "$actual" = "$expected"
      - name: Commit validated product bytes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/patch_evening_canonical_hfn_root.py .github/workflows/validate-evening-canonical-hfn-root-exact.yml
          git add run-fidelity-evening.ps1 tests/test_fidelity_evening_hfn_context_derivation.py tests/test_fidelity_evening_component_gap_execution.py
          git commit -m 'Validated canonical HFN root product bytes'
          git push origin HEAD:validate/evening-canonical-hfn-root-exact
