name: patch-evening-summary-v1-bool

on:
  push:
    branches:
      - fix/evening-summary-v1-bool

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/evening-summary-v1-bool
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install locked environment
        run: python -m pip install --disable-pip-version-check -c requirements/linux-ci-python.lock.txt -e ".[test]"
      - name: Apply bool-safe evening summary patch
        run: python .github/patch_evening_summary_v1_bool.py
      - name: Parse PowerShell and compile regression
        shell: pwsh
        run: |
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'run-fidelity-evening.ps1'), [ref]$null, [ref]$null)
          python -m py_compile tests/test_fidelity_evening_summary_v1_authority.py
      - name: Run focused regressions
        run: >-
          python -m pytest -q
          tests/test_fidelity_evening_summary_v1_authority.py
          tests/test_fidelity_evening_command.py
      - name: Validate patch boundary
        run: |
          git diff --check -- run-fidelity-evening.ps1 tests/test_fidelity_evening_summary_v1_authority.py
          grep -F 'Test-V1Version $summary.version' run-fidelity-evening.ps1
          ! grep -F '[int]$summary.version' run-fidelity-evening.ps1
          actual="$( { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u )"
          expected="$(printf '%s\n' run-fidelity-evening.ps1 tests/test_fidelity_evening_summary_v1_authority.py | sort)"
          test "$actual" = "$expected"
      - name: Commit product patch and remove helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/patch_evening_summary_v1_bool.py .github/workflows/patch-evening-summary-v1-bool.yml
          git add run-fidelity-evening.ps1 tests/test_fidelity_evening_summary_v1_authority.py
          git commit -m 'Make qualified evening summary v1 authority bool-safe'
          git push origin HEAD:fix/evening-summary-v1-bool
