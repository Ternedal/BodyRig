name: patch-wsl-recovery-status-v1

on:
  push:
    branches:
      - fix/wsl-recovery-status-version-v1

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Assert exact checkout authority
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA" || { echo "checkout mismatch: $actual != $EXPECTED_SHA" >&2; exit 1; }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install locked Linux test environment
        run: python -m pip install --disable-pip-version-check -c requirements/linux-ci-python.lock.txt -e ".[test]"
      - name: Apply focused product patch and regression
        shell: bash
        env:
          TEST_FILE_B64: 
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path("bodyrig/recover_cli.py")
          text = path.read_text(encoding="utf-8")
          old = (
              '    if (\n'
              '        status_payload["format"] != _FILE_COMMAND_STATUS_FORMAT\n'
              '        or status_payload["version"] != _FILE_COMMAND_STATUS_VERSION\n'
              '        or isinstance(status_payload["returncode"], bool)\n'
              '        or not isinstance(status_payload["returncode"], int)\n'
              '    ):\n'
          )
          new = (
              '    version = status_payload["version"]\n'
              '    if (\n'
              '        status_payload["format"] != _FILE_COMMAND_STATUS_FORMAT\n'
              '        or isinstance(version, bool)\n'
              '        or not isinstance(version, (int, float))\n'
              '        or version != _FILE_COMMAND_STATUS_VERSION\n'
              '        or isinstance(status_payload["returncode"], bool)\n'
              '        or not isinstance(status_payload["returncode"], int)\n'
              '    ):\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one completion-status block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          Path("tests/test_recovery_status_version_authority.py").write_bytes(
              base64.b64decode(os.environ["TEST_FILE_B64"])
          )
          PY
      - name: Compile focused files
        run: python -m py_compile bodyrig/recover_cli.py tests/test_recovery_status_version_authority.py
      - name: Run focused WSL recovery authority tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q tests/test_recovery_status_version_authority.py tests/test_recover_cli.py
      - name: Enforce product diff boundary
        shell: bash
        run: |
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(bodyrig/recover_cli.py tests/test_recovery_status_version_authority.py)
          printf 'changed: %s\n' "${changed[@]}"
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${changed[$i]}" = "${expected[$i]}"
          done
      - name: Commit validated product bytes and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/patch-wsl-recovery-status-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reject boolean v1 in WSL recovery completion status"
          git push origin HEAD:fix/wsl-recovery-status-version-v1
