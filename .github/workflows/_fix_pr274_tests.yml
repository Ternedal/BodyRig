name: fix-pr274-tests

on:
  push:
    branches:
      - fix/post-physical-ab-operator-hardening-20260910

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/post-physical-ab-operator-hardening-20260910
          fetch-depth: 0

      - name: Apply exact test corrections
        run: python tools/_fix_pr274_tests.py

      - name: Commit corrected tests only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix post-physical hardening regression tests"
          git push origin HEAD:fix/post-physical-ab-operator-hardening-20260910
