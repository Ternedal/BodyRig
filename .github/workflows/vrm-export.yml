name: vrm-export

# Third-party asset -> VRM 1.0 with real Blender (hash-locked bpy 4.5.15) and the
# pinned add-ons, on Linux (bubblewrap) and Windows (Job Object). The host-side
# tests (tests/test_vrm_export.py) also run in ci.yml without Blender.

on:
  pull_request:
    paths:
      - "bodyrig/vrm_export.py"
      - "bodyrig/vrm_export_cli.py"
      - "bodyrig/blender_vrm_worker.py"
      - "bodyrig/humanoid_names.py"
      - "bodyrig/vrm_paths.py"
      - "bodyrig/blender_vrm_weights.py"
      - "bodyrig/blender_scene_worker.py"
      - "bodyrig/scene_inspector.py"
      - "bodyrig/process_limits.py"
      - "scripts/vrm_export_setup.py"
      - "tests/test_vrm_export*.py"
      - "tests/test_vrm_paths.py"
      - "tests/test_vrm_weights_rollback.py"
      - "tests/blender_fixtures/make_vrm_corpus_bpy.py"
      - "requirements/blender-bpy.lock.txt"
      - "setup-vrm-export-wsl.ps1"
      - "run-vrm-export-wsl.ps1"
      - ".github/workflows/vrm-export.yml"
  push:
    branches: [main]
    paths:
      - "bodyrig/vrm_export.py"
      - "bodyrig/vrm_export_cli.py"
      - "bodyrig/blender_vrm_worker.py"
      - "bodyrig/humanoid_names.py"
      - "bodyrig/vrm_paths.py"
      - "bodyrig/blender_vrm_weights.py"
      - "bodyrig/blender_scene_worker.py"
      - "bodyrig/scene_inspector.py"
      - "bodyrig/process_limits.py"
      - "scripts/vrm_export_setup.py"
      - "tests/test_vrm_export*.py"
      - "tests/test_vrm_paths.py"
      - "tests/test_vrm_weights_rollback.py"
      - "tests/blender_fixtures/make_vrm_corpus_bpy.py"
      - "requirements/blender-bpy.lock.txt"
      - "setup-vrm-export-wsl.ps1"
      - "run-vrm-export-wsl.ps1"
      - ".github/workflows/vrm-export.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vrm-e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            lock: requirements/linux-ci-python.lock.txt
            require_bwrap: "1"
          - os: windows-2025
            lock: requirements/windows-python.lock.txt
            require_bwrap: "0"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact checkout authority
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA" || { echo "checkout mismatch: $actual != $EXPECTED_SHA" >&2; exit 1; }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install locked BodyRig test environment
        run: python -m pip install --disable-pip-version-check -c ${{ matrix.lock }} -e ".[test]"
      - name: Install the hash-locked bpy runtime in its own venv
        run: |
          python -m venv "$RUNNER_TEMP/bpy-venv"
          if [ -x "$RUNNER_TEMP/bpy-venv/Scripts/python.exe" ]; then
            bpy_python="$RUNNER_TEMP/bpy-venv/Scripts/python.exe"
          else
            bpy_python="$RUNNER_TEMP/bpy-venv/bin/python"
          fi
          "$bpy_python" -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/blender-bpy.lock.txt
          "$bpy_python" -I -c "import bpy, ctypes, os, sys; print('bpy', bpy.app.version_string); sys.stdout.flush(); os.name == 'nt' and ctypes.windll.kernel32.TerminateProcess(ctypes.c_void_p(-1), ctypes.c_uint(0)); os._exit(0)"
          echo "BODYRIG_BPY_PYTHON=$bpy_python" >> "$GITHUB_ENV"
      - name: Enable bubblewrap (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / --unshare-all --die-with-parent true
      - name: Install the pinned VRM and XPS add-ons
        run: python scripts/vrm_export_setup.py --addons "$RUNNER_TEMP/vrm-addons"
      - name: VRM export tests with real Blender
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          BODYRIG_REQUIRE_BWRAP: ${{ matrix.require_bwrap }}
          BODYRIG_VRM_ADDONS: ${{ runner.temp }}/vrm-addons
        run: python -m pytest -q -rs tests/test_vrm_export.py tests/test_vrm_paths.py tests/test_vrm_weights_rollback.py tests/test_vrm_export_wsl.py tests/test_vrm_export_blender.py
      - name: Timings (informational, CI runner, not the rig)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          corpus="$RUNNER_TEMP/vrm-corpus"
          "$BODYRIG_BPY_PYTHON" -I tests/blender_fixtures/make_vrm_corpus_bpy.py -- "$corpus"
          for run in cold warm; do
            python -m bodyrig.vrm_export_cli export "$corpus/xps_pack.zip" "$corpus/xps_names.fbx" \
              "$corpus/valve.blend" "$corpus/daz.blend" "$corpus/anon.blend" --out "$RUNNER_TEMP/vrm-out-$run" \
              --addons "$RUNNER_TEMP/vrm-addons" --cache "$RUNNER_TEMP/vrm-cache" \
              --bpy-python "$BODYRIG_BPY_PYTHON" > "$RUNNER_TEMP/vrm-$run.json"
          done
          python - "$RUNNER_TEMP" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          print("### VRM export timings (capsule figures on the CI runner, not the rig)")
          print("| run | asset | state | total ms | cache hit |")
          print("|---|---|---|---|---|")
          for run in ("cold", "warm"):
              report = json.load(open(f"{sys.argv[1]}/vrm-{run}.json", encoding="utf-8"))
              for r in report["results"]:
                  print(f"| {run} | {r['source']} | {r['state']} | {r['timings_ms'].get('total')} | {r['cache']['hit']} |")
          PY
      - name: Assert tests did not mutate tracked files
        run: test -z "$(git status --porcelain)" || { git status --short; exit 1; }
