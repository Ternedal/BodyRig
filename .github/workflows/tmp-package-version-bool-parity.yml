name: tmp-package-version-bool-parity

on:
  push:
    branches:
      - staging/package-version-bool-parity-20260912

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Apply portable package version boolean parity fix
        run: python .github/scripts/tmp_package_version_bool_parity.py
      - name: Install locked Linux test environment
        run: python -m pip install --disable-pip-version-check -c requirements/linux-ci-python.lock.txt -e ".[test]"
      - name: Validate full suite and product diff
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m compileall -q bodyrig tests
          python -m pytest -q
          git diff --check
          python - <<'PY'
          import subprocess
          expected = {"bodyrig/package.py", "tests/test_package.py"}
          changed = {
              line.strip()
              for line in subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
              if line.strip()
          }
          if changed != expected:
              raise SystemExit(f"unexpected product diff: {sorted(changed)} != {sorted(expected)}")
          print("Product diff: PASS | " + ", ".join(sorted(changed)))
          PY
      - name: Publish validated staging product tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/scripts/tmp_package_version_bool_parity.py .github/workflows/tmp-package-version-bool-parity.yml
          git add bodyrig/package.py tests/test_package.py
          git diff --cached --check
          git commit -m 'Reject boolean package versions at schema boundary'
          git push origin HEAD:staging/package-version-bool-parity-20260912
          test "$(git diff --name-only c65711034a2d057e179805160157d5d5594f4fdc..HEAD | sort | tr '\n' ' ')" = "bodyrig/package.py tests/test_package.py "
