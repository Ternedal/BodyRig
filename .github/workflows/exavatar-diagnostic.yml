name: exavatar-diagnostic

on:
  push:
    branches:
      - diag/exavatar-final-symlink-containment-runner
  workflow_dispatch:

concurrency:
  group: exavatar-diagnostic-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnostic-tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest==9.1.1

      - name: Compile diagnostic tools
        run: |
          python -m py_compile \
            tools/photoreal_exavatar_scene_scale_diagnostic.py \
            tools/photoreal_exavatar_prepare_rasterizer_ab.py \
            tools/photoreal_exavatar_scene_scale_ab.py

      - name: Run diagnostic-only tests
        run: |
          python -m pytest -q \
            tests/test_photoreal_exavatar_scene_scale_diagnostic.py \
            tests/test_photoreal_exavatar_rasterizer_ab.py \
            tests/test_photoreal_exavatar_scene_scale_ab.py

  powershell-parse:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4

      - name: Parse ExAvatar PowerShell operators
        shell: pwsh
        run: |
          $files = @(
            'prepare-photoreal-exavatar-rasterizer-ab.ps1',
            'prepare-photoreal-exavatar-runtime.ps1',
            'resume-photoreal-exavatar-from-fit-diagnostic.ps1',
            'run-photoreal-exavatar-fit-diagnostic.ps1',
            'run-photoreal-exavatar-scene-scale-ab.ps1',
            'run-photoreal-exavatar-scene-scale-diagnostic.ps1',
            'run-photoreal-v2-exavatar-teacher.ps1'
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Missing PowerShell operator: $file"
            }
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $file).Path,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $detail = ($errors | ForEach-Object {
                "$($_.Extent.StartLineNumber):$($_.Extent.StartColumnNumber) $($_.Message)"
              }) -join '; '
              throw "PowerShell parse failed for ${file}: $detail"
            }
          }

