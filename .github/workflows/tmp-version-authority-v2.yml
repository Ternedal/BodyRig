name: tmp-version-authority-v2

on:
  push:
    branches: [staging/version-authority-v2-20260911]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Apply product patch
        run: python tools/tmp_patch_version_authority_v2.py
      - name: Install locked test environment
        run: |
          python -m pip install --disable-pip-version-check -c requirements/linux-ci-python.lock.txt -e ".[test]"
          python -m pip check
      - name: Validate full suite and clean diff
        run: |
          python -m compileall -q bodyrig tests
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path('contracts').glob('*.json')):
              json.loads(path.read_text(encoding='utf-8'))
          PY
          python -m pytest -q
          git diff --check
      - name: Publish validated candidate tree
        shell: bash
        run: |
          expected=$(cat <<'EOF'
          reference-renderer/Assets/BodyRig/BodyRigJsonUtility.cs
          reference-renderer/Assets/BodyRig/BodyRigMotorDriver.cs
          tests/test_reference_renderer_json_utility_guard.py
          tests/test_reference_renderer_json_whitespace_guard.py
          tests/test_reference_renderer_raw_numeric_ranges.py
          tests/test_reference_renderer_version_authority.py
          EOF
          )
          actual="$(git status --porcelain | sed -E 's/^.. //' | grep -v '^\.github/workflows/tmp-version-authority-v2.yml$' | grep -v '^tools/tmp_patch_version_authority_v2.py$' | sort)"
          test "$actual" = "$(printf '%s\n' "$expected" | sort)" || { echo 'Unexpected product diff:'; git status --short; exit 1; }
          rm .github/workflows/tmp-version-authority-v2.yml tools/tmp_patch_version_authority_v2.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Preserve raw Motor State version authority'
          git push origin HEAD:staging/version-authority-v2-20260911
