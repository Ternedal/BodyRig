name: 3D asset inventory
on:
  pull_request:
    paths:
      - 'tools/asset3d_inventory.py'
      - 'tests/test_asset3d_inventory.py'
      - '.github/workflows/asset3d-inventory.yml'
  push:
    branches: [main]
    paths:
      - 'tools/asset3d_inventory.py'
      - 'tests/test_asset3d_inventory.py'
      - '.github/workflows/asset3d-inventory.yml'
jobs:
  inventory:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run isolated inventory tests
        run: python -m unittest discover -s tests -p test_asset3d_inventory.py -v
