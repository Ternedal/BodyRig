name: tmp-fix-low-level-v1-near-one

on:
  push:
    branches:
      - fix/low-level-physical-v1-bool-hardening-20260913

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/low-level-physical-v1-bool-hardening-20260913
          fetch-depth: 0
      - name: Apply exact low-level v1 fixes
        shell: python
        run: |
          from pathlib import Path

          targets = [
              Path('run-windows-renderer-probe.ps1'),
              Path('run-quest-renderer-probe.ps1'),
              Path('record-renderer-acceptance.ps1'),
          ]
          old_helper = 'return [decimal]$Value -eq [decimal]1'
          new_helper = 'return $Value -eq 1'
          old_contract = '[decimal]$contractVersion -ne [decimal]1'
          new_contract = '$contractVersion -ne 1'
          for path in targets:
              text = path.read_text(encoding='utf-8')
              if old_helper not in text:
                  raise SystemExit(f'missing helper pattern in {path}')
              text = text.replace(old_helper, new_helper)
              if old_contract in text:
                  text = text.replace(old_contract, new_contract)
              path.write_text(text, encoding='utf-8', newline='\n')

          test_path = Path('tests/test_low_level_physical_v1_bool_hardening.py')
          text = test_path.read_text(encoding='utf-8')
          text = text.replace(
              '        assert "[decimal]$Value -eq [decimal]1" in source, relative\n',
              '        assert "return $Value -eq 1" in source, relative\n'
              '        assert "[decimal]$Value" not in source, relative\n'
          )
          if 'test_numeric_v1_guard_rejects_near_one_values' not in text:
              text += r'''


def test_numeric_v1_guard_rejects_near_one_values() -> None:
    import shutil
    import subprocess

    pwsh = shutil.which("pwsh")
    if pwsh is None:
        import pytest
        pytest.skip("PowerShell 7 is not available")
    helper = r'''function Test-V1Version($Value) {
    if ($null -eq $Value -or $Value -is [bool] -or $Value -isnot [ValueType]) { return $false }
    return $Value -eq 1
}'''
    cases = (
        ('{"version":1}', True),
        ('{"version":1.0}', True),
        ('{"version":true}', False),
        ('{"version":"1"}', False),
        ('{"version":1.000000000000001}', False),
    )
    for payload, expected in cases:
        expected_ps = "$true" if expected else "$false"
        command = (
            helper
            + "\n$value = ('"
            + payload.replace("'", "''")
            + "' | ConvertFrom-Json).version\n"
            + f"if ((Test-V1Version $value) -ne {expected_ps}) {{ exit 17 }}"
        )
        result = subprocess.run([pwsh, "-NoProfile", "-Command", command], check=False)
        assert result.returncode == 0, payload
'''
          test_path.write_text(text, encoding='utf-8', newline='\n')
      - name: Revert unrelated upstream file from this PR
        run: git checkout origin/main -- check-reference-renderer-ready.ps1
      - name: Commit exact patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add run-windows-renderer-probe.ps1 run-quest-renderer-probe.ps1 record-renderer-acceptance.ps1 tests/test_low_level_physical_v1_bool_hardening.py check-reference-renderer-ready.ps1
          if git diff --cached --quiet; then
            echo 'No patch needed.'
            exit 0
          fi
          git commit -m 'Reject near-one low-level physical v1 evidence'
          git push origin HEAD:fix/low-level-physical-v1-bool-hardening-20260913
