name: tmp-runtime-body-name-unicode

on:
  push:
    branches: [staging/runtime-body-name-unicode-20260911]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Apply body-name Unicode schema patch
        run: python tools/tmp_patch_runtime_body_name_unicode.py
      - name: Install locked test environment
        run: |
          python -m pip install --disable-pip-version-check -c requirements/linux-ci-python.lock.txt -e ".[test]"
          python -m pip check
      - name: Validate full suite and clean diff
        run: |
          python -m compileall -q bodyrig tests
          python -m pytest -q
          git diff --check
      - name: Publish validated candidate tree
        shell: bash
        run: |
          expected=$(cat <<'EOF'
          contracts/bodyrig-runtime-assets-v1.schema.json
          tests/test_runtime_manifest_body_name_unicode_schema.py
          EOF
          )
          actual="$(git status --porcelain | sed -E 's/^.. //' | grep -v '^\.github/workflows/tmp-runtime-body-name-unicode.yml$' | grep -v '^tools/tmp_patch_runtime_body_name_unicode.py$' | sort)"
          test "$actual" = "$(printf '%s\n' "$expected" | sort)" || { echo 'Unexpected product diff:'; git status --short; exit 1; }
          rm .github/workflows/tmp-runtime-body-name-unicode.yml tools/tmp_patch_runtime_body_name_unicode.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Require well-formed Unicode in runtime body names'
          git push origin HEAD:staging/runtime-body-name-unicode-20260911
