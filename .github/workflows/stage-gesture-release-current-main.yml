name: stage-gesture-release-current-main

on:
  push:
    branches:
      - staging/gesture-release-on-current-main-20260911

permissions:
  contents: write

jobs:
  stage:
    if: ${{ !contains(github.event.head_commit.message, '[gesture-rebased-applied]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install locked Linux test environment
        run: python -m pip install --disable-pip-version-check -c requirements/linux-ci-python.lock.txt -e ".[test]"
      - name: Apply gesture ownership patch
        run: python .github/apply_gesture_release_rebased.py
      - name: Run focused renderer regressions
        run: python -m pytest -q tests/test_reference_renderer_gesture_release_ownership.py tests/test_reference_renderer_motor_v3_contract.py tests/test_reference_renderer_motor_v2_contract.py tests/test_expression_release_contract.py tests/test_speech_viseme_release_contract.py
      - name: Check whitespace
        run: git diff --check
      - name: Commit staged source and test
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference-renderer/Assets/BodyRig/BodyRigMotorDriver.cs tests/test_reference_renderer_gesture_release_ownership.py
          git commit -m "Release gesture-owned bones on transitions [gesture-rebased-applied]"
          git push origin HEAD:${{ github.ref_name }}
