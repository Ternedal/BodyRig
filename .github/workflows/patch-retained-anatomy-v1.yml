name: patch-retained-anatomy-v1

on:
  push:
    branches:
      - fix/retained-anatomy-v1-publication

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Assert exact checkout authority
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA" || { echo "checkout mismatch: $actual != $EXPECTED_SHA" >&2; exit 1; }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install locked Linux test environment
        run: python -m pip install --disable-pip-version-check -c requirements/linux-ci-python.lock.txt -e ".[test]"
      - name: Apply focused product patch and regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          product = Path("bodyrig/retained_anatomy_source.py")
          text = product.read_text(encoding="utf-8")
          old_authority = '    if value.get("format") != AUTHORITY_FORMAT or value.get("version") != AUTHORITY_VERSION:\n'
          new_authority = (
              '    version = value.get("version")\n'
              '    if (\n'
              '        value.get("format") != AUTHORITY_FORMAT\n'
              '        or isinstance(version, bool)\n'
              '        or not isinstance(version, (int, float))\n'
              '        or version != AUTHORITY_VERSION\n'
              '    ):\n'
          )
          old_reconstruction = '    if reconstruction["format"] != RECON_FORMAT or reconstruction["version"] != RECON_VERSION:\n'
          new_reconstruction = (
              '    reconstruction_version = reconstruction["version"]\n'
              '    if (\n'
              '        reconstruction["format"] != RECON_FORMAT\n'
              '        or isinstance(reconstruction_version, bool)\n'
              '        or not isinstance(reconstruction_version, (int, float))\n'
              '        or reconstruction_version != RECON_VERSION\n'
              '    ):\n'
          )
          if text.count(old_authority) != 1 or text.count(old_reconstruction) != 1:
              raise SystemExit("retained anatomy v1 authority source moved")
          product.write_text(
              text.replace(old_authority, new_authority, 1).replace(old_reconstruction, new_reconstruction, 1),
              encoding="utf-8",
          )

          tests = Path("tests/test_retained_anatomy_source.py")
          current = tests.read_text(encoding="utf-8")
          marker = "test_publish_rejects_noncanonical_reconstruction_v1"
          if marker in current:
              raise SystemExit("retained anatomy v1 regressions already present")
          append = r'''

          INVALID_V1_VALUES = (True, False, "1", None, 2)
          VALID_V1_VALUES = (1, 1.0)


          def _set_reconstruction_version(source: Path, version: object) -> None:
              stage = source / "sith-input-v1"
              reconstruction_path = stage / "reconstruction.json"
              reconstruction = json.loads(reconstruction_path.read_text(encoding="utf-8"))
              reconstruction["version"] = version
              reconstruction_path.write_text(json.dumps(reconstruction), encoding="utf-8")

              authority_path = stage / AUTHORITY_FILENAME
              authority = json.loads(authority_path.read_text(encoding="utf-8"))
              authority["reconstruction_sha256"] = _sha256(reconstruction_path)
              authority_path.write_text(json.dumps(authority), encoding="utf-8")


          @pytest.mark.parametrize("version", INVALID_V1_VALUES)
          def test_publish_rejects_noncanonical_reconstruction_v1(
              tmp_path: Path,
              version: object,
          ) -> None:
              source = _source_workspace(tmp_path)
              output = tmp_path / "retained"
              _set_reconstruction_version(source, version)

              with pytest.raises(RetainedAnatomySourceError, match="reconstruction evidence format/version mismatch"):
                  publish_retained_anatomy_source(source, output)

              assert not output.exists()


          @pytest.mark.parametrize("version", VALID_V1_VALUES)
          def test_publish_accepts_numeric_reconstruction_v1(
              tmp_path: Path,
              version: object,
          ) -> None:
              source = _source_workspace(tmp_path)
              output = tmp_path / "retained"
              _set_reconstruction_version(source, version)

              receipt = publish_retained_anatomy_source(source, output)

              assert receipt["production_activation"] is False
              assert receipt["human_review_required"] is True


          @pytest.mark.parametrize("version", INVALID_V1_VALUES)
          def test_publish_rejects_noncanonical_model_family_authority_v1(
              tmp_path: Path,
              version: object,
          ) -> None:
              source = _source_workspace(tmp_path)
              output = tmp_path / "retained"
              authority_path = source / "sith-input-v1" / AUTHORITY_FILENAME
              authority = json.loads(authority_path.read_text(encoding="utf-8"))
              authority["version"] = version
              authority_path.write_text(json.dumps(authority), encoding="utf-8")

              with pytest.raises(RetainedAnatomySourceError, match="model-family authority format/version mismatch"):
                  publish_retained_anatomy_source(source, output)

              assert not output.exists()


          @pytest.mark.parametrize("version", VALID_V1_VALUES)
          def test_publish_accepts_numeric_model_family_authority_v1(
              tmp_path: Path,
              version: object,
          ) -> None:
              source = _source_workspace(tmp_path)
              output = tmp_path / "retained"
              authority_path = source / "sith-input-v1" / AUTHORITY_FILENAME
              authority = json.loads(authority_path.read_text(encoding="utf-8"))
              authority["version"] = version
              authority_path.write_text(json.dumps(authority), encoding="utf-8")

              receipt = publish_retained_anatomy_source(source, output)

              assert receipt["production_activation"] is False
              assert receipt["human_review_required"] is True
          '''
          # Dedent the workflow-embedded regression and force exactly one EOF newline.
          import textwrap
          append = textwrap.dedent(append).rstrip()
          tests.write_text(current.rstrip() + "\n\n" + append + "\n", encoding="utf-8")
          PY
      - name: Compile focused files
        run: python -m py_compile bodyrig/retained_anatomy_source.py tests/test_retained_anatomy_source.py
      - name: Run focused retained-anatomy tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q tests/test_retained_anatomy_source.py tests/test_retained_anatomy_source_integration.py tests/test_sith_reconstruction_v1_authority_routes.py
      - name: Enforce exact two-file product boundary
        shell: bash
        run: |
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(bodyrig/retained_anatomy_source.py tests/test_retained_anatomy_source.py)
          printf 'changed: %s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          for i in "${!expected[@]}"; do
            test "${changed[$i]}" = "${expected[$i]}"
          done
      - name: Commit validated product bytes and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/patch-retained-anatomy-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden retained anatomy v1 publication boundary"
          git push origin HEAD:fix/retained-anatomy-v1-publication
