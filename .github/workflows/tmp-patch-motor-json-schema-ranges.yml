name: tmp-patch-motor-json-schema-ranges

on:
  push:
    branches:
      - fix/motor-json-schema-ranges-20260911

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/motor-json-schema-ranges-20260911
          fetch-depth: 0
      - name: Apply schema value guard patch
        run: python tools/tmp_patch_motor_json_schema_ranges.py
      - name: Install locked test environment
        run: python -m pip install --disable-pip-version-check -c requirements/linux-ci-python.lock.txt -e ".[test]"
      - name: Validate focused contracts
        run: |
          python -m pytest -q \
            tests/test_reference_renderer_json_utility_guard.py \
            tests/test_reference_renderer_json_schema_value_guard.py \
            tests/test_reference_renderer_motor_v2_contract.py \
            tests/test_reference_renderer_motor_v3_contract.py \
            tests/test_reference_renderer_expression_release_contract.py \
            tests/test_reference_renderer_speech_release_contract.py
          git diff --check
      - name: Commit real patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference-renderer/Assets/BodyRig/BodyRigJsonUtility.cs tests/test_reference_renderer_json_schema_value_guard.py
          git commit -m "Enforce Motor State schema value constraints"
          git push origin HEAD:fix/motor-json-schema-ranges-20260911
