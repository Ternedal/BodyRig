name: apply-motor-json-driver-ranges

on:
  push:
    branches:
      - fix/motor-json-shared-types-main-20260911

permissions:
  contents: write

jobs:
  validate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/motor-json-shared-types-main-20260911
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply driver range checks
        run: python .github/apply_motor_json_driver_ranges.py
      - name: Install locked test environment
        run: python -m pip install --disable-pip-version-check -c requirements/linux-ci-python.lock.txt -e ".[test]"
      - name: Run focused renderer contract regressions
        run: >-
          python -m pytest -q
          tests/test_reference_renderer_json_utility_guard.py
          tests/test_reference_renderer_motor_v2_contract.py
          tests/test_reference_renderer_motor_v3_contract.py
          tests/test_reference_renderer_small_shrug_atomicity.py
          tests/test_reference_renderer_gesture_release_ownership.py
          tests/test_motor_state_v2.py
          tests/test_motor_state_v3.py
      - name: Check whitespace
        run: git diff --check
      - name: Commit clean result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/apply_motor_json_driver_ranges.py .github/workflows/apply-motor-json-driver-ranges.yml
          git add reference-renderer/Assets/BodyRig/BodyRigMotorDriver.cs
          git commit -m "Validate Motor State duration and speech ranges"
          git push origin HEAD:fix/motor-json-shared-types-main-20260911
