name: integrate-motor-json-current-main

on:
  push:
    branches:
      - fix/motor-json-shared-types-current-main-20260911

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, '[run-json-integration]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/motor-json-shared-types-current-main-20260911
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply renderer range checks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('reference-renderer/Assets/BodyRig/BodyRigMotorDriver.cs')
          source = path.read_text(encoding='utf-8')
          old = '''            Validate01(next.motion.energy, "motion.energy");\n            Validate01(next.motion.head_motion, "motion.head_motion");\n            if (next.expression != null)'''
          new = '''            Validate01(next.motion.energy, "motion.energy");\n            Validate01(next.motion.head_motion, "motion.head_motion");\n            ValidateRange(next.duration_ms, 0.0f, 120000.0f, "duration_ms");\n            if (next.expression != null)'''
          if old not in source:
              raise SystemExit('duration anchor missing or already changed')
          source = source.replace(old, new, 1)
          old = '''                if (next.speech.elapsed_ms < 0) throw new ArgumentOutOfRangeException("speech.elapsed_ms");\n                Validate01(next.speech.amplitude, "speech.amplitude");'''
          new = '''                if (next.speech.elapsed_ms < 0 || next.speech.elapsed_ms > 3600000)\n                    throw new ArgumentOutOfRangeException("speech.elapsed_ms");\n                Validate01(next.speech.amplitude, "speech.amplitude");'''
          if old not in source:
              raise SystemExit('speech range anchor missing or already changed')
          source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          PY
      - name: Install focused test environment
        run: python -m pip install -e '.[test]'
      - name: Run combined regressions
        run: |
          python -m pytest -q \
            tests/test_reference_renderer_json_utility_guard.py \
            tests/test_reference_renderer_motor_v2_contract.py \
            tests/test_reference_renderer_motor_v3_contract.py \
            tests/test_reference_renderer_expression_release_contract.py \
            tests/test_reference_renderer_speech_release_contract.py \
            tests/test_reference_renderer_small_shrug_atomicity.py \
            tests/test_reference_renderer_gesture_release_ownership.py
          git diff --check
      - name: Commit clean integration result
        shell: bash
        run: |
          git rm .github/workflows/integrate-motor-json-current-main.yml .github/trigger-motor-json-current-main.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reference-renderer/Assets/BodyRig/BodyRigMotorDriver.cs
          git commit -m 'Integrate Motor State JSON hardening with facial ownership fixes'
          git push origin HEAD:fix/motor-json-shared-types-current-main-20260911
