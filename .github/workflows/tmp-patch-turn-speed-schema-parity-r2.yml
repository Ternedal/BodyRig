name: tmp-patch-turn-speed-schema-parity-r2

on:
  push:
    branches:
      - staging/turn-speed-schema-parity-r2-20260911

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: staging/turn-speed-schema-parity-r2-20260911
          fetch-depth: 0
      - name: Apply turn-speed schema parity fix
        run: python tools/tmp_patch_turn_speed_schema_parity_r2.py
      - name: Install locked test environment
        run: python -m pip install --disable-pip-version-check -c requirements/linux-ci-python.lock.txt -e ".[test]"
      - name: Validate focused contracts
        run: |
          python -m pytest -q \
            tests/test_reference_renderer_turn_speed_schema_parity.py \
            tests/test_reference_renderer_raw_numeric_ranges.py \
            tests/test_reference_renderer_motor_v3_contract.py \
            tests/test_reference_renderer_gesture_arm_ownership_contract.py \
            tests/test_reference_renderer_json_utility_guard.py
          git diff --check
      - name: Commit real patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            reference-renderer/Assets/BodyRig/BodyRigMotorDriver.cs \
            tests/test_reference_renderer_turn_speed_schema_parity.py \
            tests/test_reference_renderer_motor_v3_contract.py
          git commit -m "Align renderer turn-speed range with Motor State v3"
          git push origin HEAD:staging/turn-speed-schema-parity-r2-20260911
