name: tmp-personality-blueprint-ratio-overflow

on:
  push:
    branches:
      - staging/personality-blueprint-ratio-overflow-20260912

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply personality ratio overflow patch
        run: python tools/_tmp_apply_personality_ratio_overflow.py
      - name: Install locked Linux test environment
        run: python -m pip install --disable-pip-version-check -c requirements/linux-ci-python.lock.txt -e ".[test]"
      - name: Run focused personality regressions
        run: python -m pytest -q tests/test_personality_blueprint.py tests/test_personality_embodiment_binding.py tests/test_embodiment_assembly.py
      - name: Check diff whitespace
        run: git diff --check
      - name: Commit validated product patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-personality-blueprint-ratio-overflow.yml tools/_tmp_apply_personality_ratio_overflow.py
          git add bodyrig/personality_blueprint.py tests/test_personality_blueprint.py tests/test_personality_embodiment_binding.py
          git commit -m "Fail closed on huge personality blueprint ratios"
          git push origin HEAD:staging/personality-blueprint-ratio-overflow-20260912
